<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A small collection of photographs from Carson LaFreniere.">
  <title>Carson LaFreniere | Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light; --paper: #f5f4ee; --ink: #20251f; --muted: #656b60; --green: #245c45; --lime: #d7e36a; --line: #d8d9cf; --serif: "DM Serif Display", Georgia, serif; --sans: "DM Sans", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background-color: var(--paper); background-image: linear-gradient(rgba(36, 92, 69, .035) 1px, transparent 1px), linear-gradient(90deg, rgba(36, 92, 69, .035) 1px, transparent 1px); background-size: 32px 32px; font: 16px/1.6 var(--sans); }
    a { color: inherit; }
    .wrap { width: min(1080px, calc(100% - 40px)); margin-inline: auto; }
    header { border-bottom: 1px solid var(--line); background: rgba(245, 244, 238, .92); }
    .nav { min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .brand { color: var(--green); font-weight: 700; text-decoration: none; }
    nav { display: flex; gap: 28px; }
    nav a { color: var(--muted); font-size: .94rem; text-decoration: none; }
    nav a:hover, nav a[aria-current="page"] { color: var(--green); }
    main { padding: clamp(64px, 10vw, 112px) 0 96px; }
    .eyebrow { margin: 0 0 16px; color: var(--green); font-size: .78rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font: 400 clamp(3rem, 8vw, 6rem)/1 var(--serif); }
    .intro { max-width: 580px; margin: 24px 0 52px; color: var(--muted); font-size: 1.08rem; }
    .gallery { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px 20px; }
    figure { min-width: 0; margin: 0; }
    figure img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: var(--line); }
    figcaption { padding-top: 12px; color: var(--muted); font-size: .92rem; }
    footer { padding: 22px 0; border-top: 1px solid var(--line); color: var(--muted); font-size: .88rem; }
    @media (max-width: 760px) { .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 560px) {
      .wrap { width: min(100% - 28px, 1080px); }
      .nav { min-height: 68px; align-items: flex-start; flex-direction: column; justify-content: center; gap: 2px; padding-block: 10px; }
      nav { width: 100%; gap: 20px; }
      nav a { font-size: .88rem; }
      main { padding-top: 68px; }
      .gallery { grid-template-columns: 1fr; gap: 24px; }
    }
    @media (prefers-reduced-motion: no-preference) {
      main > * { animation: rise .55s both; }
      main > *:nth-child(2) { animation-delay: .08s; }
      main > *:nth-child(3) { animation-delay: .16s; }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap nav">
      <a class="brand" href="index.html">Carson LaFreniere</a>
      <nav aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="gallery.html" aria-current="page">Gallery</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    <p class="eyebrow">A few favorite views</p>
    <h1>Gallery</h1>
    <p class="intro">A collection of quiet moments and places worth pausing for.</p>
    <div class="gallery" aria-label="Photo gallery">
      <figure>
        <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&amp;fit=crop&amp;w=900&amp;q=80" alt="Mountain lake reflecting the surrounding peaks" loading="lazy">
        <figcaption>Still water, mountain air</figcaption>
      </figure>
      <figure>
        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&amp;fit=crop&amp;w=900&amp;q=80" alt="Sunlit landscape with rolling hills" loading="lazy">
        <figcaption>Out where the hills roll</figcaption>
      </figure>
      <figure>
        <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&amp;fit=crop&amp;w=900&amp;q=80" alt="Warm sunrise over a green field" loading="lazy">
        <figcaption>A slower kind of morning</figcaption>
      </figure>
      <figure>
        <img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&amp;fit=crop&amp;w=900&amp;q=80" alt="Ocean waves moving toward the shore" loading="lazy">
        <figcaption>Following the tide</figcaption>
      </figure>
      <figure>
        <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&amp;fit=crop&amp;w=900&amp;q=80" alt="A scenic open landscape beneath a wide sky" loading="lazy">
        <figcaption>Room to wander</figcaption>
      </figure>
      <figure>
        <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?auto=format&amp;fit=crop&amp;w=900&amp;q=80" alt="Green meadow beneath a cloudy sky" loading="lazy">
        <figcaption>Green in every direction</figcaption>
      </figure>
    </div>
  </main>
  <footer><div class="wrap">&copy; 2026 Carson LaFreniere</div></footer>
</body>
</html>
